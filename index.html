const canvas = document.getElementById('game');

const W = CFG.view.w, H = CFG.view.h;
const FIT = { ratio:W/H, dprCap:2, pad:8, maxCssH:960,
              hooks:['resize','orientationchange','visualViewport','ResizeObserver','pageshow'],
              cssW:0, cssH:0, dpr:1, pw:0, ph:0 };
function computeFitBox(availW,availH){
  const maxW=Math.max(160,availW-FIT.pad*2);
  const maxH=Math.max(220,availH-FIT.pad*2);
  const h0=Math.min(maxH,FIT.maxCssH);
  const cssW=Math.max(160,Math.floor(Math.min(maxW,h0*FIT.ratio)));
  const cssH=Math.round(cssW/FIT.ratio);
  return {cssW,cssH};
}
function viewportBox(){
  const wrap=document.getElementById('wrap');
  const vv=window.visualViewport;
  let w=(wrap&&wrap.clientWidth>0)?wrap.clientWidth:(window.innerWidth||720);
  let h=(wrap&&wrap.clientHeight>0)?wrap.clientHeight:(window.innerHeight||960);
  if(vv&&vv.width>0&&vv.height>0){w=Math.min(w,vv.width);h=Math.min(h,vv.height);}
  return {w:Math.max(160,w),h:Math.max(220,h)};
}
function fitViewport(){
  const box=viewportBox(), b=computeFitBox(box.w,box.h);
  canvas.style.width=b.cssW+'px';
  canvas.style.height=b.cssH+'px';
  const dpr=Math.min(window.devicePixelRatio||1,FIT.dprCap);
  const pw=Math.round(W*CFG.view.scale*dpr), ph=Math.round(H*CFG.view.scale*dpr);
  if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph;}
  ctx.setTransform(pw/W,0,0,ph/H,0,0);
  ctx.imageSmoothingEnabled=false;
  FIT.cssW=b.cssW;FIT.cssH=b.cssH;FIT.dpr=dpr;FIT.pw=pw;FIT.ph=ph;
  return b;
}

function smooth(u){ u=clamp(u,0,1); return u*u*(3-2*u); }
function Ip(z){ if(z<=0) return 0; if(z>=1) return 0.5+(z-1); return z*z*z - z*z*z*z/2; }
function pad(n,d){ return String(Math.max(0,Math.floor(n))).padStart(d,'0'); }

const CORE = {

  modeCfg(mode){ return mode==='ZEN'?CFG.zen:(mode==='HARD'?CFG.hard:CFG.standard); },

  stdHp(t,mode){
    const h=(mode==='HARD'?CFG.hard:CFG.standard).hp, g=CFG.time.gate;
    if(t<g) return CFG.enemy.baseHp + h.preGain*smooth((t/g-h.preStart)/(1-h.preStart));
    const base=(CFG.enemy.baseHp+h.preGain)*Math.exp(Math.log(h.postG)*h.postTau*Ip((t-g)/h.postTau));
    const d=Math.max(0,t-CFG.time.fork);
    return base*Math.exp(0.5*h.k2*d*d);
  },

  zenCapHp(){ return CORE.stdHp(CFG.zen.hp.capAtStandardSec); },

  hardOffset(){ return CORE.stdHp(CFG.hard.initialAt)-CFG.enemy.baseHp; },

  baseHp(t,mode){
    if(mode==='ZEN'){
      const z=CFG.zen.hp, cap=CORE.zenCapHp();
      return z.flatHp+(cap-z.flatHp)*smooth((t-z.rampStart)/z.rampSec);
    }
    const capAt=CORE.modeCfg(mode).hpCapAt;
    const tt=(capAt===null||capAt===undefined)?t:Math.min(t,capAt);

    const base=CORE.stdHp(tt,mode==='HARD'?'HARD':'STANDARD');
    return mode==='HARD' ? base+CORE.hardOffset() : base;
  },
  typeMul(t,type,mode){
    const m=CORE.modeCfg(mode);
    if(!m.typeRampSec) return CFG.enemy.typeMul[type];
    return 1+(CFG.enemy.typeMul[type]-1)*smooth((t-CFG.time.gate)/m.typeRampSec);
  },

  maxHp(t,type,mode){
    const M=CORE.modeCfg(mode);
    const base=CORE.baseHp(t,mode);
    const mid=base*CORE.typeMul(t,'m',mode);
    const anchor=CORE.baseHp(CFG.time.gate,mode);

    const hHP=M.heavySlope
      ? (t<CFG.time.gate ? base : anchor+M.heavySlope*(mid-anchor))
      : base*CORE.typeMul(t,'h',mode);
    if(M.smallSlope){

      const h0=CORE.baseHp(0,mode);
      if(type==='s') return CFG.enemy.baseHp+M.smallSlope*(hHP-h0);
      if(type==='h') return hHP;
      return mid;
    }
    if(M.smallFlatHp && type==='s') return CFG.enemy.baseHp;
    if(M.heavySlope && type==='h') return hHP;
    return base*CORE.typeMul(t,type,mode);
  },

  spreadVel(angleDeg,speed){
    const a=angleDeg*Math.PI/180;
    return { vx:speed*Math.sin(a), vy:-speed*Math.cos(a) };
  },

  degrade(t,mode){
    const m=CORE.modeCfg(mode);
    if(!m.bombDegrade) return 1;
    return CFG.bomb.from-(CFG.bomb.from-CFG.bomb.to)*clamp((t-CFG.time.gate)/CFG.bomb.span,0,1);
  },
  bombDamage(t,mode){ return CORE.baseHp(t,mode)*CORE.degrade(t,mode); },
  spawnRate(t,mode){
    if(mode==='ZEN'){
      const z=CFG.enemy.zenRate;
      return lerp(z.from,z.to,clamp(t/CFG.enemy.warmup.sec,0,1));
    }
    const r=CFG.enemy.rate, w=CFG.enemy.warmup;
    let v;
    if(t<w.sec) v=lerp(w.from,w.to,clamp(t/w.sec,0,1));
    else if(t<CFG.time.gate) v=lerp(r.p1[0],r.p1[1],clamp((t-w.sec)/(CFG.time.gate-w.sec),0,1));
    else if(t<CFG.time.collapse) v=lerp(r.p2[0],r.p2[1],clamp((t-CFG.time.gate)/(CFG.time.collapse-CFG.time.gate),0,1));
    else if(t<CFG.time.fork) v=lerp(r.p3[0],r.p3[1],clamp((t-CFG.time.collapse)/(CFG.time.fork-CFG.time.collapse),0,1));
    else v=r.p3[1]+r.after*(t-CFG.time.fork);

    return (mode==='HARD'&&t>=CFG.time.gate)
      ? v*CFG.hard.spawnMulAfterGate : v;
  },

  slantVx(slant,jitterX){ return slant + jitterX*CFG.pickup.driftGain; },
  swirlVel(theta,radius,rate){
    const S=CFG.pickup.swirl;
    return { vx:-radius*rate*Math.sin(theta),
             vy: radius*rate*Math.cos(theta)*S.yGain };
  },

  enemyVisible(e){
    if(!CFG.enemy.visibleInvuln) return true;
    return (e.y + e.h/2) >= CFG.enemy.visibleEnterPx;
  },

  winNeed(mode){ return mode==='ZEN' ? 0
                  : (mode==='HARD' ? null : CFG.power.winNeed.STANDARD); },

  powerSlice(mode,pPlanned){
    if(mode==='ZEN') return 0;
    if(mode==='HARD') return pPlanned>0 ? CFG.power.totalBonusCap/pPlanned : 0;
    return CFG.power.totalBonusCap/CFG.power.winNeed.STANDARD;
  },

  bulletDamage(mode,power,spread){
    const base=CORE.damage(mode,power);
    return (mode==='ZEN'&&spread) ? base*CFG.barrage.zenSpread.damageScale : base;
  },

  idleScoringOk(mode,t,lastInputT){
    return !(mode==='ZEN' && t-lastInputT>=CFG.zen.idleSec);
  },

  powerSchedule(n,mode){
    const s=CFG.pickup.powerSchedule;
    const to=(mode==='HARD'&&CFG.hard.qualifyAllP)?CFG.hard.quotaEndSec:s.toSec;
    const out=[];
    for(let i=0;i<n;i++) out.push(s.fromSec+(to-s.fromSec)*(i+0.5)/n);
    return out;
  },
  bombTimes(mode){ return CORE.modeCfg(mode).bombSchedule.slice(); },

  damage(mode,power){
    if(mode==='ZEN') return CFG.barrage.baseDamage;
    return CFG.barrage.baseDamage+Math.min(CFG.power.totalBonusCap,power);
  },
  stepToward(px,py,tx,ty,dt){
    const dx=tx-px, dy=ty-py, len=Math.hypot(dx,dy);
    if(len<1.5) return {x:px,y:py,nx:0,ny:0};
    const nx=dx/len, ny=dy/len;
    return { x:px+nx*CFG.player.speed*dt, y:py+ny*CFG.player.speed*dt, nx, ny };
  },

  allPEaten(state){
    if(state.mode==='ZEN') return false;
    if(state.mode==='HARD') return state.qualified===true;
    return state.pEaten>=CFG.power.winNeed.STANDARD;
  },

  blueGateOk(t,lastSwitchT,lastBlueSpawnT,nextGap){
    return t-lastSwitchT>=CFG.zen.minWeaponSec && t-lastBlueSpawnT>=nextGap;
  },
  greenGateOk(t,lastGreenSpawnT,nextGap){
    return t-lastGreenSpawnT>=nextGap;
  },
};

function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let z=Math.imul(seed^seed>>>15,1|seed); z=z+Math.imul(z^z>>>7,61|z)^z;
  return ((z^z>>>14)>>>0)/4294967296; }; }

const Audio_ = {
  ac:null, master:null, muted:false, lastBlast:-1,
  init(){
    if(this.ac) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return;
      this.ac=new AC();
      this.master=this.ac.createGain();
      this.master.gain.value=this.muted?0:CFG.audio.master;
      this.master.connect(this.ac.destination);

    }catch(err){ this.ac=null; }
  },
  resume(){ this.init(); if(this.ac&&this.ac.state==='suspended') this.ac.resume(); },
  suspend(){ if(this.ac&&this.ac.state==='running') this.ac.suspend(); },
  toggleMute(){
    this.muted=!this.muted;
    if(this.master) this.master.gain.setTargetAtTime(this.muted?0:CFG.audio.master,this.ac.currentTime,0.02);

    try{localStorage.setItem('2mininvaders.clean.muted',this.muted?'1':'0');}catch(err){}
    return this.muted;
  },
  tone(freq,dur,gain,type,slideTo){
    if(!this.ac||this.muted)return;
    const t2=this.ac.currentTime,o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t2);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t2+dur);
    g.gain.setValueAtTime(0.0001,t2); g.gain.exponentialRampToValueAtTime(gain,t2+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t2+dur);
    o.connect(g);g.connect(this.master);o.start(t2);o.stop(t2+dur+0.02);
  },
  noise(dur,gain,cutoff){
    if(!this.ac||this.muted)return;
    const t2=this.ac.currentTime,len=Math.floor(this.ac.sampleRate*dur);
    const buf=this.ac.createBuffer(1,len,this.ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ac.createBufferSource();src.buffer=buf;
    const f=this.ac.createBiquadFilter();f.type='lowpass';f.frequency.value=cutoff||1200;
    const g=this.ac.createGain();g.gain.value=gain;
    src.connect(f);f.connect(g);g.connect(this.master);src.start(t2);
  },

  enemyDown(t2){
    if(!this.ac||this.muted)return;
    if(t2-this.lastBlast<CFG.audio.enemyDownThrottleMs/1000)return;
    this.lastBlast=t2;
    const g=CFG.audio.enemyDownGain;
    this.tone(190,0.055,g*0.4,'square',95);
    this.noise(0.055,g*0.6,900);
  },
  pickup(){ const g=CFG.audio.pickupGain;
    this.tone(660,0.06,g,'triangle'); setTimeout(()=>this.tone(990,0.06,g,'triangle'),60);
    setTimeout(()=>this.tone(1320,0.06,g,'triangle'),120); },
  bomb(t2,mode){ const d=CORE.degrade(t2,mode), g=CFG.audio.bombGain;
    this.tone(120,0.4,g*(0.85+0.25*d),'sawtooth',40);
    this.noise(0.35,g*0.6,400+d*1600); },
  hurt(){ this.tone(220,0.18,CFG.audio.hurtGain,'square',110); },

  swap(toSpread){ const g=CFG.audio.swapGain;
    this.tone(toSpread?520:760,0.12,g,'triangle',toSpread?900:420);
    setTimeout(()=>this.tone(toSpread?1040:520,0.09,g*0.8,'triangle'),90); },

  alert(){ const g=CFG.audio.gateCueGain;
    this.tone(440,0.15,g,'square'); setTimeout(()=>this.tone(330,0.15,g,'square'),150);
    setTimeout(()=>this.tone(440,0.15,g,'square'),300); setTimeout(()=>this.tone(330,0.15,g,'square'),450); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,0.22,CFG.audio.winGain,'triangle'),i*140)); },
  over(){ [523,466,392,349,294].forEach((f,i)=>setTimeout(()=>this.tone(f,0.16,CFG.audio.overGain,'triangle'),i*150)); },
};
try{ Audio_.muted=localStorage.getItem('2mininvaders.clean.muted')==='1'; }catch(err){}

const Input = {
  keys:new Set(), source:'keyboard', target:null, targetAlive:false,

  activityFlag:false,
  isActive(){
    if(this.keys.size||this.activityFlag) return true;
    if(typeof navigator.getGamepads==='function'){
      const gp=navigator.getGamepads()[0];
      if(gp && Math.hypot(gp.axes[0]||0,gp.axes[1]||0)>=0.2) return true;
    }
    return false;
  },
  init(){
    addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();
      if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d','p','m','r','t','q','y','n','escape','enter','1','2','3'].includes(k))e.preventDefault();
      beginInteraction();

      if(k===CFG.ui.debugKey){ debugOpen=!debugOpen; return; }
      if(debugOpen) return;

      if(confirmQuit){
        if(k==='y'||k==='enter'||k===' '){confirmQuit=false;paused=false;endGame('QUIT');}
        else if(k==='n'||k==='escape'||k==='p'){confirmQuit=false;paused=false;notifyInput('RESUME');}
        return;
      }
      if(k==='m'){ notifyInput(Audio_.toggleMute()?'MUTE ON':'MUTE OFF'); return; }
      if(state==='MENU'){
        if(k==='1'){ menuSel=0; return; }
        if(k==='2'){ menuSel=1; return; }
        if(k==='3'){ menuSel=2; return; }
        if(k==='arrowup'){ menuSel=(menuSel+2)%3; return; }
        if(k==='arrowdown'){ menuSel=(menuSel+1)%3; return; }
        if(k==='enter'||k===' '){ startGame(CFG.menu.modes[menuSel]); return; }
        return;
      }
      if(state==='RESULT'){
        if(k==='r'){ startGame(mode); return; }
        if(k===' '||k==='enter'||k==='escape'){ toMenu(); return; }
        return;
      }

      if(k==='p'){ togglePause(); return; }

      if(k==='q'||k==='escape'){
        confirmQuit=true;paused=true;notify=null;
        return;
      }
      if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
        this.keys.add(k);this.source='keyboard';this.activityFlag=true;}
    });
    addEventListener('keyup',e=>this.keys.delete(e.key.toLowerCase()));
    const toLU=(cx,cy)=>{const r=canvas.getBoundingClientRect();
      return {x:clamp((cx-r.left)/r.width*W,0,W),y:clamp((cy-r.top)/r.height*H,0,H)};};

    canvas.addEventListener('pointermove',e=>{const p=toLU(e.clientX,e.clientY);
      if(confirmQuit)return;
      this.activityFlag=true;
      if(state==='MENU'){ const m=hitMenu(p); if(m) menuSel=CFG.menu.modes.indexOf(m); }
      if(state==='PLAY'&&!this.keys.size&&!hitPause(p)){this.target=p;this.targetAlive=true;this.source='pointer';}});
    canvas.addEventListener('pointerdown',e=>{
      e.preventDefault(); beginInteraction(); this.activityFlag=true;
      if(debugOpen) return;
      const p=toLU(e.clientX,e.clientY);
      if(dupPress(e,p))return;
      if(confirmQuit){
        const c=hitConfirm(p);
        if(c==='YES'){confirmQuit=false;paused=false;endGame('QUIT');}
        else if(c==='NO'){confirmQuit=false;paused=false;notifyInput('RESUME');}
        return;
      }
      if(state==='MENU'){
        const m=hitMenu(p);
        if(m){menuSel=CFG.menu.modes.indexOf(m);startGame(m);}
        return;
      }
      if(state==='RESULT'){
        if(hitResult(p)==='RESTART'){startGame(mode);return;}
        toMenu();return;
      }
      if(hitPause(p)){confirmQuit=true;paused=true;notify=null;return;}
      this.target=p;this.targetAlive=true;this.source='pointer';
    });
    canvas.addEventListener('pointerleave',()=>{if(this.source==='pointer')this.targetAlive=false;});
    canvas.addEventListener('touchstart',e=>{
      e.preventDefault(); beginInteraction(); this.activityFlag=true;
      if(debugOpen) return;
      const tc=e.touches[0],p=toLU(tc.clientX,tc.clientY);
      if(dupPress(e,p))return;
      if(confirmQuit){
        const c=hitConfirm(p);
        if(c==='YES'){confirmQuit=false;paused=false;endGame('QUIT');}
        else if(c==='NO'){confirmQuit=false;paused=false;notifyInput('RESUME');}
        return;
      }
      if(state==='MENU'){
        const m=hitMenu(p);
        if(m){menuSel=CFG.menu.modes.indexOf(m);startGame(m);}
        return;
      }
      if(state==='RESULT'){
        if(hitResult(p)==='RESTART'){startGame(mode);return;}
        toMenu();return;
      }
      if(hitPause(p)){confirmQuit=true;paused=true;notify=null;return;}
      this.target={x:p.x,y:p.y-24};this.targetAlive=true;this.source='touch';
    },{passive:false});
    canvas.addEventListener('touchmove',e=>{
      e.preventDefault(); this.activityFlag=true;
      if(state!=='PLAY')return;
      const tc=e.touches[0],p=toLU(tc.clientX,tc.clientY);
      this.target={x:p.x,y:p.y-24};this.targetAlive=true;this.source='touch';
    },{passive:false});
    canvas.addEventListener('touchend',e=>{e.preventDefault();if(e.touches.length===0)this.targetAlive=false;},{passive:false});
    addEventListener('gamepadconnected',()=>notifyInput('GAMEPAD READY'));
  },
  dir(){
    if(this.keys.size){
      let x=0,y=0;
      if(this.keys.has('a')||this.keys.has('arrowleft'))x-=1;
      if(this.keys.has('d')||this.keys.has('arrowright'))x+=1;
      if(this.keys.has('w')||this.keys.has('arrowup'))y-=1;
      if(this.keys.has('s')||this.keys.has('arrowdown'))y+=1;
      const l=Math.hypot(x,y)||1;return {x:x/l,y:y/l};
    }
    if(typeof navigator.getGamepads==='function'){
      const gp=navigator.getGamepads()[0];
      if(gp){
        let x=gp.axes[0]||0,y=gp.axes[1]||0;const b=gp.buttons;
        if(b[14]&&b[14].pressed)x-=1;if(b[15]&&b[15].pressed)x+=1;
        if(b[12]&&b[12].pressed)y-=1;if(b[13]&&b[13].pressed)y+=1;
        if(Math.hypot(x,y)>=0.2){this.source='gamepad';const l=Math.hypot(x,y);return {x:x/l,y:y/l};}
      }
    }
    if(this.targetAlive&&this.target&&(this.source==='pointer'||this.source==='touch'))return null;
    return {x:0,y:0};
  },
};

let state='MENU', paused=false, debugOpen=false, menuSel=0;

let confirmQuit=false, pT=-1e9, pX=-999, pY=-999;
let t=0, acc=0, gateFired=false, endReason='DOWN', mode='STANDARD';
let player=null, enemies=[], bullets=[], pickups=[], fx=[], stars=[];
let score=0, hi={STANDARD:0,HARD:0,ZEN:0}, combo=1, lastKillT=-99, maxCombo=1, kills=0, killBucketB=0;
let lastBDrop=-99, fireAcc=0, spawnAcc=0, ceaseSpawn=false, zenBombBucket=0;
let pPlanned=0, pSlice=0, pSchedule=[], pDone=[], pEaten=0, pSpawned=0, pendingP=0;
let bombSchedule=[], bombDone=[], bombsSpawned=0, bombsEaten=0, pendingB=0, lastChanceFired=false;

let cSpawned=0, cEaten=0, killsSinceBlue=0;
let lastSwitchT=0, lastBlueSpawnT=-99, blueNextGap=20;
let lastGreenSpawnT=-99, greenNextGap=12, gSpawnedZ=0;
let hardQualified=false;

let lastInputT=0, idle=false;
let resultSurvival=0, resultBonus=0, resultEnemies=0;
let notify=null, notifyT=0;

let deathAnim=null;

function loadHi(){
  try{
    hi.STANDARD=Number(localStorage.getItem(CFG.score.hiscoreKey.STANDARD))||0;
    hi.HARD=Number(localStorage.getItem(CFG.score.hiscoreKey.HARD))||0;
    hi.ZEN=Number(localStorage.getItem(CFG.score.hiscoreKey.ZEN))||0;
  }catch(err){}
}
loadHi();

function addScore(v){
  if(mode==='ZEN'&&idle) return;
  score+=v;
}

function notifyInput(msg){notify=msg;notifyT=0.9;}
function beginInteraction(){Audio_.resume();}
function togglePause(){if(state==='PLAY'){paused=!paused;notifyInput(paused?'PAUSED':'RESUME');}}
function toMenu(){ state='MENU'; paused=false; notify=null; deathAnim=null; confirmQuit=false; }

function makeStars(){stars=[];for(let i=0;i<46;i++)stars.push({x:Math.floor(rnd(0,W)),y:Math.floor(rnd(0,H)),c:i%3===0?C.star2:C.star,s:i%3===0?18:(i%3===1?10:6)});}
function makeEnemy(x,y,type,col){
  const S=CFG.enemy.sway;
  return {x,bx:x,y,col,type,dmg:0,hp:CORE.maxHp(t,type,mode),
    fall:rnd(CFG.enemy.fall[0],CFG.enemy.fall[1]),lastHit:-99,
    w:type==='s'?8:(type==='m'?12:16),h:type==='s'?8:(type==='m'?10:14),
    amp:rnd(S.amp[0],S.amp[1]),freq:rnd(S.freq[0],S.freq[1]),phase:rnd(0,6.283),
    driftAim:rnd(-S.drift,S.drift),drift:0,turn:rnd(S.turn[0],S.turn[1]),age:0};
}
function spawnOne(){
  if(enemies.length>=CFG.enemy.max)return;
  const c=Math.floor(rnd(0,CFG.enemy.cols));
  const x=CFG.enemy.x0+c*CFG.enemy.colGap;
  const type=Math.random()<0.10?'h':(Math.random()<0.22?'m':'s');
  enemies.push(makeEnemy(x,CFG.enemy.spawnY-rnd(0,6),type,c));
}
function startGame(m){
  mode=m; state='PLAY'; paused=false; t=0; acc=0; gateFired=false;
  endReason='DOWN'; ceaseSpawn=false; confirmQuit=false;
  score=0; combo=1; maxCombo=1; lastKillT=-99; kills=0; killBucketB=0;
  lastBDrop=-99; fireAcc=0; spawnAcc=0;

  player={x:CFG.player.spawnX,y:CFG.player.spawnY,hp:CFG.player.hp,power:0,
          invuln:0,tilt:0,spread:CORE.modeCfg(m).spread===true};
  enemies=[]; bullets=[]; pickups=[]; fx=[]; notify=null; notifyT=0;

  pPlanned = CORE.modeCfg(m).powerQuota
    ? Math.floor(rnd(CFG.power.plannedCount[0],CFG.power.plannedCount[1]+1)) : 0;

  pSlice = pPlanned?CORE.powerSlice(mode,pPlanned):0;

  pSchedule = pPlanned?CORE.powerSchedule(pPlanned,mode).map(v=>v+rnd(-0.35,0.35)):[];
  pDone = new Array(pPlanned).fill(false);
  pEaten=0; pSpawned=0; pendingP=0;
  bombSchedule=CORE.bombTimes(m); bombDone=bombSchedule.map(()=>false);
  bombsSpawned=0; bombsEaten=0; pendingB=0; lastChanceFired=false; zenBombBucket=0;

  cSpawned=0; cEaten=0; killsSinceBlue=0;
  lastSwitchT=0; lastBlueSpawnT=-99; blueNextGap=CFG.zen.blueMinGapSec;
  lastGreenSpawnT=-99; greenNextGap=CFG.zen.greenMinGapSec; gSpawnedZ=0;
  hardQualified=false;
  lastInputT=0; idle=false;
  resultSurvival=0; resultBonus=0; resultEnemies=0;
  deathAnim=null;

  Audio_.lastBlast=-1;
  makeStars(); Audio_.resume();
}

function endGame(reason){
  if(state!=='PLAY')return;
  state='RESULT'; endReason=reason; paused=false;
  resultSurvival=+t.toFixed(1);
  resultBonus=player.power;
  resultEnemies=enemies.length;

  addScore(player.hp*CFG.score.hpBonus);
  score=Math.floor(score);

  if(score>hi[mode]){hi[mode]=score;try{localStorage.setItem(CFG.score.hiscoreKey[mode],String(score));}catch(err){}}

  deathAnim = reason==='DOWN' ? makeDeathAnim(player.x, player.y) : null;
  if(reason==='WIN')Audio_.win(); else Audio_.over();
}

function makeDeathAnim(x,y){
  const F=CFG.fx, rr=mulberry32(0xC0FFEE), parts=[];
  for(let i=0;i<F.deathParts;i++){
    const a=rr()*6.283, sp=F.deathSpeed[0]+rr()*(F.deathSpeed[1]-F.deathSpeed[0]);
    parts.push({x:x+(rr()-0.5)*12, y:y+(rr()-0.5)*12,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-26,
      s:2+Math.floor(rr()*3), life:F.deathDur*(0.55+rr()*0.45), delay:rr()*0.12});
  }
  return {t:0,dur:F.deathDur,x,y,parts};
}

function frameFx(dt){for(let i=fx.length-1;i>=0;i--){fx[i].age+=dt;if(fx[i].age>=fx[i].life)fx.splice(i,1);}}

function ringRect(cx,cy,r,c){
  const x=Math.round(cx-r),y=Math.round(cy-r),s=Math.round(2*r);
  R(x,y,s,1,c);R(x,y+s,s,1,c);R(x,y,1,s,c);R(x+s,y,1,s,c);
}

function dropY(e){ return clamp(e.y-CFG.pickup.spawnLift,
  CFG.pickup.spawnMinY, CFG.pickup.spawnCapY); }
function countPickup(kind){let n=0;for(const p of pickups)if(p.kind===kind)n++;return n;}

function blueFromKill(){
  if(mode!=='ZEN') return false;
  if(countPickup('c')>=CFG.pickup.blueMax) return false;
  if(!CORE.blueGateOk(t,lastSwitchT,lastBlueSpawnT,blueNextGap)) return false;
  killsSinceBlue++;
  if(killsSinceBlue>=CFG.zen.bluePityKills || Math.random()<CFG.zen.blueChance){
    killsSinceBlue=0;
    lastBlueSpawnT=t;
    blueNextGap=CFG.zen.blueMinGapSec+rnd(0,CFG.zen.blueGapJitterSec);
    return true;
  }
  return false;
}
function dropPickup(kind,x,y){
  if(pickups.length>=CFG.pickup.max)return false;

  const motion=CORE.modeCfg(mode).pickupMotion;
  const SL=CFG.pickup.slant, SW=CFG.pickup.swirl;
  const big=motion==='slant'&&Math.random()<SL.chance;
  const slant=motion==='slant'
    ? (Math.random()<0.5?-1:1)*rnd(big?SL.vx[0]:SL.small[0],big?SL.vx[1]:SL.small[1])
    : 0;
  pickups.push({kind,x,y,vy:rnd(CFG.pickup.fall[0],CFG.pickup.fall[1]),vx:0,
    slant,
    swirlR: motion==='swirl'?rnd(SW.radius[0],SW.radius[1]):0,
    swirlW: motion==='swirl'?rnd(SW.rate[0],SW.rate[1]):0,
    theta: rnd(0,6.283),
    jitterX:rnd(CFG.pickup.jitterX[0],CFG.pickup.jitterX[1]),
    turn:rnd(CFG.pickup.turn[0],CFG.pickup.turn[1])});
  addFx({type:'drop',x,y,life:0.16});
  return true;
}
function killEnemy(e, allowDrop){

  addScore(CFG.score.killScore);
  combo=Math.min(CFG.score.comboMax,combo+CFG.score.comboStep);
  maxCombo=Math.max(maxCombo,combo);lastKillT=t;kills++;
  addFx({type:'boom',x:e.x,y:e.y,life:0.10,size:e.w});Audio_.enemyDown(t);

  if(allowDrop===false) return;

  if(blueFromKill()){
    if(dropPickup('c',e.x,dropY(e)))cSpawned++;
    return;
  }
  const P=CFG.pickup, BM=P.bomb;
  if(pendingP>0){
    if(dropPickup('p',e.x,dropY(e))){pendingP--;pSpawned++;}
  } else if(pendingB>0&&countPickup('b')<P.bombMax){
    if(dropPickup('b',e.x,dropY(e))){pendingB--;bombsSpawned++;}
  } else {

    if(mode==='ZEN'&&CORE.greenGateOk(t,lastGreenSpawnT,greenNextGap)&&
       kills%CFG.zen.scoreEveryKills===0&&Math.random()<CFG.zen.scoreChance){
      if(dropPickup('p',e.x,dropY(e))){
        lastGreenSpawnT=t;gSpawnedZ++;
        greenNextGap=CFG.zen.greenMinGapSec+rnd(0,CFG.zen.greenGapJitterSec);
      }
    }
    const bb=Math.floor(kills/BM.quotaEveryKills);
    if(bb>killBucketB){
      killBucketB=bb;
      if(bombsSpawned<(bombSchedule.length+BM.maxExtra)&&t-lastBDrop>=BM.cooldown&&
         Math.random()<BM.chance&&countPickup('b')<P.bombMax){
        lastBDrop=t;
        if(dropPickup('b',e.x,dropY(e)))bombsSpawned++;
      }
    }
  }
}
function useBomb(){
  const d=CORE.degrade(t,mode);
  const color=d>0.85?C.white:(d>0.65?C.gold:(d>0.45?C.orange:C.red));
  addFx({type:'bomb',life:0.25,color});Audio_.bomb(t,mode);

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(!CORE.enemyVisible(e))continue;
    e.dmg+=e.hp*d;
    addFx({type:'hit',x:e.x,y:e.y,life:0.05});
    if(e.dmg>=e.hp){killEnemy(e,false);enemies.splice(i,1);}
  }
}
function pickUp(p){

  const v=CFG.score.pickup[p.kind];
  addScore(v);Audio_.pickup();notifyInput('+'+v);
  if(p.kind==='c'){

    cEaten++;lastSwitchT=t;
    if(mode==='ZEN'){
      player.spread=!player.spread;
      notifyInput('+'+v+' '+(player.spread?'SPREAD':'STRAIGHT'));
      Audio_.swap(player.spread);
    }
    addFx({type:'ring',x:player.x,y:player.y,life:0.25});
    return;
  }
  if(p.kind==='p'){

    pEaten++;
    if(mode!=='ZEN'){
      if(player.power<CFG.power.totalBonusCap-1e-9){
        player.power=Math.min(CFG.power.totalBonusCap,player.power+(pSlice||0));
      }
    }
    addFx({type:'ring',x:player.x,y:player.y,life:0.2});
    return;
  }
  bombsEaten++;useBomb();
}

function step(dt){
  t+=dt;
  const M=CORE.modeCfg(mode);

  if(!gateFired&&M.gateAudio&&t>=CFG.time.gate){gateFired=true;Audio_.alert();}

  if(Input.isActive()) lastInputT=t;
  Input.activityFlag=false;
  idle = !CORE.idleScoringOk(mode,t,lastInputT);
  addScore(CFG.score.survive*dt);
  if(t-lastKillT>CFG.score.comboWindow)combo=1;
  if(notifyT>0)notifyT-=dt;
  frameFx(dt);

  const d=Input.dir();let nx=0,ny=0;
  if(d===null){const r=CORE.stepToward(player.x,player.y,Input.target.x,Input.target.y,dt);
    player.x=r.x;player.y=r.y;nx=r.nx;ny=r.ny;}
  else{nx=d.x;ny=d.y;player.x+=nx*CFG.player.speed*dt;player.y+=ny*CFG.player.speed*dt;}
  player.x=clamp(player.x,8,W-8);player.y=clamp(player.y,CFG.view.hud+8,H-8);
  player.tilt=nx<-0.1?-1:(nx>0.1?1:0);
  if(player.invuln>0)player.invuln=Math.max(0,player.invuln-dt);

  fireAcc+=dt*1000;const B=CFG.barrage, ZS=B.zenSpread;

  const interval = player.spread ? B.fireIntervalMs/ZS.freqScale : B.fireIntervalMs;
  while(fireAcc>=interval){fireAcc-=interval;
    if(player.spread){

      for(let i=0;i<ZS.straightWays;i++){
        bullets.push({x:player.x+rnd(-B.jitter,B.jitter),y:player.y-8,
          vx:0,vy:-B.speed,gold:true});
      }
      for(const a of ZS.angles){
        const vR=CORE.spreadVel(a,B.speed), vL=CORE.spreadVel(-a,B.speed);
        bullets.push({x:player.x+rnd(-ZS.jitter,ZS.jitter),y:player.y-8,
          vx:vR.vx,vy:vR.vy,gold:true});
        bullets.push({x:player.x+rnd(-ZS.jitter,ZS.jitter),y:player.y-8,
          vx:vL.vx,vy:vL.vy,gold:true});
      }
    }else{

      for(let i=0;i<B.perVolley;i++){
        const ox=B.offsets[i]+rnd(-B.jitter,B.jitter);
        bullets.push({x:player.x+ox,y:player.y-8,vx:0,vy:-B.speed,gold:false});
      }
    }
  }

  const dmg=CORE.bulletDamage(mode,player.power,player.spread);
  const cols=new Map();
  for(const e of enemies){const ci=Math.floor(e.x/16);if(!cols.has(ci))cols.set(ci,[]);cols.get(ci).push(e);}
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-8||b.x<-8||b.x>W+8){bullets.splice(i,1);continue;}
    const ci=Math.floor(b.x/16);
    for(let k=ci-1;k<=ci+1;k++){
      const arr=cols.get(k);if(!arr)continue;
      for(const e of arr){
        if(e.dead)continue;
        if(!CORE.enemyVisible(e))continue;
        if(Math.abs(b.x-e.x)<e.w/2+B.bulletW/2&&b.y<e.y+e.h/2&&b.y+B.bulletH>e.y-e.h/2){
          if(t-e.lastHit>=B.perEnemyHitCooldownMs/1000){e.lastHit=t;e.dmg+=dmg;addFx({type:'hit',x:b.x,y:e.y,life:0.035});}
        }
      }
    }
  }
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];
    if(e.dmg>=e.hp){e.dead=true;killEnemy(e,true);enemies.splice(i,1);}}

  const S=CFG.enemy.sway;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.age+=dt;e.turn-=dt;
    if(e.turn<=0){e.driftAim=rnd(-S.drift,S.drift);e.turn=rnd(S.turn[0],S.turn[1]);}
    e.drift+=(e.driftAim-e.drift)*clamp(dt*S.follow,0,1);
    e.x=clamp(e.bx+Math.sin(e.age*e.freq+e.phase)*e.amp+e.drift,4,W-4);
    e.y+=e.fall*dt;
    if(e.y>H+12){enemies.splice(i,1);continue;}
    if(CORE.enemyVisible(e)&&player.invuln<=0&&
       Math.abs(e.x-player.x)<e.w/2+CFG.player.hit/2&&Math.abs(e.y-player.y)<e.h/2+CFG.player.hit/2){
      player.hp-=1;player.invuln=CFG.player.invuln;enemies.splice(i,1);
      addFx({type:'hurt',life:CFG.fx.hurtLife});
      addFx({type:'impact',x:player.x,y:player.y,life:CFG.fx.impactLife});
      addFx({type:'boom',x:e.x,y:e.y,life:0.1,size:e.w});
      Audio_.hurt();notifyInput('HIT');combo=1;
      if(player.hp<=0){endGame('DOWN');return;}
    }
  }

  for(let i=0;i<pPlanned;i++){if(!pDone[i]&&t>=pSchedule[i]){pDone[i]=true;pendingP++;}}
  for(let i=0;i<bombSchedule.length;i++){if(!bombDone[i]&&t>=bombSchedule[i]){bombDone[i]=true;pendingB++;}}
  if(mode!=='ZEN'&&!lastChanceFired&&bombsEaten===0&&t>=CFG.pickup.bomb.lastChanceAt){
    lastChanceFired=true;pendingB++;
  }

  if(mode==='ZEN'&&CFG.zen.bombEverySec>0){
    const zq=Math.floor(t/CFG.zen.bombEverySec);
    if(zq>zenBombBucket){zenBombBucket=zq;pendingB++;}
  }

  if(mode==='HARD'&&!hardQualified&&t<=CFG.hard.qualifyBySec){
    const need=CFG.hard.qualifyAllP?pPlanned:CFG.power.winNeed.STANDARD;
    if(pEaten>=need)hardQualified=true;
  }

  if(M.ceaseOnAllP&&CORE.allPEaten({mode,pEaten,pPlanned,qualified:hardQualified})&&t>=M.winAt)
    ceaseSpawn=true;

  if(ceaseSpawn){
    if(enemies.length===0&&pickups.length===0){endGame('WIN');return;}
  }else{
    spawnAcc+=CORE.spawnRate(t,mode)*dt;
    while(spawnAcc>=1){spawnAcc-=1;spawnOne();}
  }

  const motion=M.pickupMotion, SW=CFG.pickup.swirl;
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i];p.turn-=dt;
    if(p.turn<=0){p.jitterX=rnd(CFG.pickup.jitterX[0],CFG.pickup.jitterX[1]);p.turn=rnd(CFG.pickup.turn[0],CFG.pickup.turn[1]);}
    if(motion==='swirl'){
      p.theta+=p.swirlW*dt;
      const sv=CORE.swirlVel(p.theta,p.swirlR,p.swirlW);
      p.x+=(sv.vx+p.jitterX*SW.jitterGain)*dt;
      p.y+=(p.vy+sv.vy)*dt;
    }else{
      p.vx=CORE.slantVx(p.slant,p.jitterX);
      p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
    if(p.x<CFG.pickup.xMin||p.x>CFG.pickup.xMax){
      p.x=clamp(p.x,CFG.pickup.xMin,CFG.pickup.xMax);
      if(motion==='swirl')p.theta+=Math.PI; else p.slant*=-1;
    }
    if(p.y>CFG.pickup.exitY){

      pickups.splice(i,1);
      continue;
    }
    if(Math.abs(p.x-player.x)<CFG.pickup.pickRadius&&Math.abs(p.y-player.y)<CFG.pickup.pickRadius){pickUp(p);pickups.splice(i,1);}
  }

  if(mode==='ZEN'&&M.maxSec&&t>=M.maxSec){endGame('ZEN_END');return;}
}

     Math.abs(p.x-pX)<t.pressDedupLU&&Math.abs(p.y-pY)<t.pressDedupLU)return true;

  return null;
}
function hitPause(p){
  const t=CFG.ui.touch;
  if(!t||!t.enabled||state!=='PLAY')return false;
  const h=t.pauseHit;
  return p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h;
}
function hitResult(p){
  const t=CFG.ui.touch;
  if(!t||!t.enabled||state!=='RESULT')return null;
  for(const b of t.resultButtons)
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b.id;
  return null;
}
function buttonFrame(b,sel){
  R(b.x,b.y,b.w,b.h,C.panel);
  const c=sel?C.gold:C.dim;
  R(b.x,b.y,b.w,1,c);R(b.x,b.y+b.h-1,b.w,1,c);
  R(b.x,b.y,1,b.h,c);R(b.x+b.w-1,b.y,1,b.h,c);
}
function buttonLabel(b,label,sel){
  buttonFrame(b,sel);
  text(label,b.x+(b.w-textW(label,1,1))/2,b.y+Math.round((b.h-7)/2),sel?C.gold:C.hud,1,1);
}

function menuOption(y,sel,label){
  const w2=textW(label,1,1), x=(W-w2)/2;
  if(sel){R(x-12,y+2,2,2,C.gold);R(x-10,y+1,2,4,C.gold);R(x-8,y,2,6,C.gold);}
  text(label,x,y+8,sel?C.gold:C.hud,1,1);
}

function hitConfirm(p){
  if(p.y>=142&&p.y<=164) return 'YES';
  if(p.y>=164&&p.y<=188) return 'NO';
  return null;
}
function drawConfirmQuit(){
  R(16,100,208,124,C.panel);
  R(16,100,208,1,C.gold);R(16,223,208,1,C.gold);
  const q=CFG.menu.confirmTitle;
  text(q,(W-textW(q,1,1))/2,116,C.white,1,1);
  const a=CFG.menu.confirmYes, b=CFG.menu.confirmNo;
  const t=CFG.ui.touch;
  if(t&&t.enabled){
    const p='PAUSED';
    text(p,(W-textW(p,1,1))/2,106,C.dim,1,1);
    buttonLabel({x:24,y:142,w:192,h:22},'QUIT',true);
    buttonLabel({x:24,y:164,w:192,h:24},'RESUME',false);
    const k='Y QUIT / N RESUME';
    text(k,(W-textW(k,1,1))/2,194,C.dim,1,1);
  }else{
    text(a,(W-textW(a,1,1))/2,150,C.gold,1,1);
    text(b,(W-textW(b,1,1))/2,174,C.hud,1,1);
  }
  const n=CFG.menu.confirmNote, m=CFG.menu.confirmSettle;
  text(n,(W-textW(n,1,1))/2,204,C.dim,1,1);
  text(m,(W-textW(m,1,1))/2,214,C.dim,1,1);
}
function drawMenu(){
  menuGradient();
  if(wordmarkImg.complete&&wordmarkImg.naturalWidth>0){
    ctx.drawImage(wordmarkImg,20,40,200,94);
  }else{
    const s='2MIN INVADERS';
    text(s,(W-textW(s,2,1))/2,80,C.white,2,1);
  }

  menuOption(190,menuSel===0,CFG.menu.standard);
  menuOption(222,menuSel===1,CFG.menu.hard);
  menuOption(254,menuSel===2,CFG.menu.zen);

  const hs='HI '+pad(hi[CFG.menu.modes[menuSel]],CFG.score.digits);
  text(hs,(W-textW(hs,1,1))/2,290,C.gold,1,1);
}

function drawDeathAnim(){
  drawBackground();
  const a=deathAnim, tt=a.t, k=tt/a.dur;
  if(k<0.28){
    const q=1-k/0.28;
    ringRect(a.x,a.y,3+q*11,C.white);
    R(a.x-3*q,a.y-3*q,6*q,6*q,C.white);
  }
  for(const p of a.parts){
    const u=Math.max(0,tt-p.delay);
    if(u<=0||u>p.life)continue;
    const px=p.x+p.vx*u, py=p.y+p.vy*u+CFG.fx.deathGravity*u*u;
    const lifeK=1-u/p.life;
    const col=lifeK>0.66?C.white:(lifeK>0.33?C.gold:C.red);
    const sz=Math.max(1,Math.round(p.s*lifeK));
    R(px-sz/2,py-sz/2,sz,sz,col);
  }
  if(k>0.55){
    const s2='SHOT DOWN';
    text(s2,(W-textW(s2,2,1))/2,40,C.red,2,1);
  }
}
function drawResult(){

  if(deathAnim&&deathAnim.t<deathAnim.dur){drawDeathAnim();return;}
  drawBackground();
  let title,color;
  if(endReason==='WIN'){title='ALL CLEAR';color=C.p;}
  else if(endReason==='DOWN'){title='SHOT DOWN';color=C.red;}
  else {title='SESSION OVER';color=C.gold;}
  text(title,(W-textW(title,2,1))/2,40,color,2,1);
  text('FINAL SCORE',(W-textW('FINAL SCORE',1,1))/2,78,C.dim,1,1);
  const sc=pad(score,CFG.score.digits);
  text(sc,(W-textW(sc,3,1))/2,94,C.gold,3,1);
  const hs='HI '+pad(hi[mode],CFG.score.digits);
  text(hs,(W-textW(hs,1,1))/2,126,C.white,1,1);
  if(CFG.ui.showResultSurvival)
    text('TIME '+resultSurvival.toFixed(1)+' S',(W-textW('TIME '+resultSurvival.toFixed(1)+' S',1,1))/2,148,C.hud,1,1);
  const t=CFG.ui.touch;
  if(t&&t.enabled){
    buttonLabel(t.resultButtons[0],CFG.menu.resultRestart,true);
    buttonLabel(t.resultButtons[1],CFG.menu.resultMenu,false);
    text('THANKS FOR PLAYING',(W-textW('THANKS FOR PLAYING',1,1))/2,246,C.dim,1,1);
  }else{
    const s2=CFG.menu.resultRestart;
    text(s2,(W-textW(s2,1,1))/2,202,Math.floor(performance.now()/400)%2?C.white:C.gold,1,1);
    const s3=CFG.menu.resultMenu;
    text(s3,(W-textW(s3,1,1))/2,218,C.hud,1,1);
    text('THANKS FOR PLAYING',(W-textW('THANKS FOR PLAYING',1,1))/2,240,C.dim,1,1);
  }
}

function drawDebug(){
  R(0,0,W,H,C.bg);
  R(0,0,W,14,C.panel);
  text('DEV / READ ONLY',6,4,C.gold,1,1);
  const M=CORE.modeCfg(mode);
  const L=[
    'MODE '+mode,
    'STATE '+state,
    'END '+endReason,
    'T '+t.toFixed(2),
    'SURV '+resultSurvival.toFixed(1),
    'SCORE '+Math.floor(score),
    'HI '+hi[mode],
    'HP '+(player?player.hp:0),
    'POWER '+(player?player.power.toFixed(3):'0'),
    'BONUS '+resultBonus.toFixed(2),
    'P EATEN '+pEaten+' / '+pPlanned,
    'ENEMIES '+enemies.length+' / '+resultEnemies,
    'BULLETS '+bullets.length,
    'PICKUPS '+pickups.length,
    'KILLS '+kills,
    'BOMBS '+bombsEaten+' / '+bombsSpawned,
    'BLUE '+cEaten+' / '+cSpawned,
    'SPREAD '+(player&&player.spread?'ON':'OFF'),
    'IDLE '+(idle?'YES':'NO'),
    'QUALIFIED '+(hardQualified?'YES':'NO'),
  ];
  const Rr=[
    'VIEW '+W+'X'+H,
    'GATE '+CFG.time.gate,
    'FORK '+CFG.time.fork,
    'HP CAP '+(M.hpCapAt===null?'NONE':M.hpCapAt),
    'K2 '+M.hp.k2,
    'WIN AT '+(M.winAt===null?'NONE':M.winAt),
    'MAX SEC '+(M.maxSec===null?'NONE':M.maxSec),
    'BASE HP '+CORE.baseHp(t,mode).toFixed(2),
    'ZEN CAP '+CORE.zenCapHp().toFixed(2),
    'HARD OFF '+CORE.hardOffset().toFixed(2),
    'SLICE '+pSlice.toFixed(4),
    'FIRE MS '+CFG.barrage.fireIntervalMs,
    'ZEN FREQ '+CFG.barrage.zenSpread.freqScale,
    'ZEN DMG X '+CFG.barrage.zenSpread.damageScale,
    'IDLE SEC '+CFG.zen.idleSec,
    'SPAWN '+CORE.spawnRate(t,mode).toFixed(1),
    'DEGRADE '+CORE.degrade(t,mode).toFixed(3),
    'KILL SCORE '+CFG.score.killScore,
  ];
  for(let i=0;i<L.length;i++) text(L[i],6,20+i*9,C.hud,1,1);
  for(let i=0;i<Rr.length;i++) text(Rr[i],124,20+i*9,C.dim,1,1);
  text('T CLOSE',6,H-10,C.dim,1,1);
}
function draw(){
  if(state==='MENU'){drawMenu();}
  else if(state==='RESULT'){drawResult();}
  else{
    drawBackground();
    for(const e of enemies)drawEnemy(e);
    for(const b of bullets)drawBullet(b);
    for(const p of pickups)drawPickup(p);
    drawPlayer();drawFx();drawHUD();

    if(confirmQuit){drawConfirmQuit();}
    else if(paused){
      R(0,0,W,H,C.bg);
      text('PAUSED',(W-textW('PAUSED',2,1))/2,H/2-14,C.gold,2,1);
      text('P RESUME',(W-textW('P RESUME',1,1))/2,H/2+8,C.dim,1,1);
      text(CFG.menu.pauseQuit,(W-textW(CFG.menu.pauseQuit,1,1))/2,H/2+22,C.dim,1,1);
      text(CFG.menu.pauseSettle,(W-textW(CFG.menu.pauseSettle,1,1))/2,H/2+34,C.dim,1,1);
    }
  }
  if(debugOpen)drawDebug();
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt>0.25)dt=0.25;

  if(deathAnim&&deathAnim.t<deathAnim.dur)
    deathAnim.t=Math.min(deathAnim.dur,deathAnim.t+dt);
  if(state==='PLAY'&&!paused&&!debugOpen&&!document.hidden){
    acc+=dt;let guard=0;
    while(acc>=CFG.time.step&&guard++<8&&state==='PLAY'){step(CFG.time.step);acc-=CFG.time.step;}
  }else acc=0;
  draw();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)Audio_.suspend();else{last=performance.now();Audio_.resume();}});
addEventListener('blur',()=>{last=performance.now();});

if(window.ResizeObserver){new window.ResizeObserver(()=>fitViewport()).observe(document.getElementById('wrap'));}
addEventListener('resize',fitViewport);
addEventListener('orientationchange',fitViewport);
addEventListener('pageshow',fitViewport);
if(window.visualViewport){window.visualViewport.addEventListener('resize',fitViewport);window.visualViewport.addEventListener('scroll',fitViewport);}
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
makeStars();
Input.init();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
